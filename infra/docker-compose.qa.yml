version: '3.8'

services:

  mysql-qa:
    image: mysql:8.0
    container_name: shopmicro-mysql-qa
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_ROOT_HOST: '%'
    ports:
      - "3307:3306"
    volumes:
      - mysql-qa-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  eureka-server:
    image: ${REGISTRY_URL:-localhost:5000}/shopmicro/eureka-server:${IMAGE_TAG:-latest}
    container_name: shopmicro-eureka-qa
    ports:
      - "9761:8761"
    environment:
      SPRING_PROFILES_ACTIVE: qa
    depends_on:
      mysql-qa:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10

  api-gateway:
    image: ${REGISTRY_URL:-localhost:5000}/shopmicro/api-gateway:${IMAGE_TAG:-latest}
    container_name: shopmicro-gateway-qa
    ports:
      - "9080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: qa
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      eureka-server:
        condition: service_healthy

  auth-service:
    image: ${REGISTRY_URL:-localhost:5000}/shopmicro/auth-service:${IMAGE_TAG:-latest}
    container_name: shopmicro-auth-qa
    ports:
      - "9081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: qa
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-qa:3306/auth_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      mysql-qa:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  product-service:
    image: ${REGISTRY_URL:-localhost:5000}/shopmicro/product-service:${IMAGE_TAG:-latest}
    container_name: shopmicro-product-qa
    ports:
      - "9082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: qa
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-qa:3306/product_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      mysql-qa:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  inventory-service:
    image: ${REGISTRY_URL:-localhost:5000}/shopmicro/inventory-service:${IMAGE_TAG:-latest}
    container_name: shopmicro-inventory-qa
    ports:
      - "9083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: qa
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-qa:3306/inventory_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      mysql-qa:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  cart-service:
    image: ${REGISTRY_URL:-localhost:5000}/shopmicro/cart-service:${IMAGE_TAG:-latest}
    container_name: shopmicro-cart-qa
    ports:
      - "9084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: qa
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-qa:3306/cart_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      mysql-qa:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  payment-service:
    image: ${REGISTRY_URL:-localhost:5000}/shopmicro/payment-service:${IMAGE_TAG:-latest}
    container_name: shopmicro-payment-qa
    ports:
      - "9085:8085"
    environment:
      SPRING_PROFILES_ACTIVE: qa
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-qa:3306/payment_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_TOpt8j6M6j1CXn}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-a6N5lZ2EpzdvNcOotw2REb7W}
    depends_on:
      mysql-qa:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  order-service:
    image: ${REGISTRY_URL:-localhost:5000}/shopmicro/order-service:${IMAGE_TAG:-latest}
    container_name: shopmicro-order-qa
    ports:
      - "9086:8086"
    environment:
      SPRING_PROFILES_ACTIVE: qa
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-qa:3306/order_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      mysql-qa:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  notification-service:
    image: ${REGISTRY_URL:-localhost:5000}/shopmicro/notification-service:${IMAGE_TAG:-latest}
    container_name: shopmicro-notification-qa
    ports:
      - "9087:8087"
    environment:
      SPRING_PROFILES_ACTIVE: qa
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-qa:3306/notification_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      mysql-qa:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

volumes:
  mysql-qa-data:
