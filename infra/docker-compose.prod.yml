version: '3.8'

services:

  mysql-prod:
    image: mysql:8.0
    container_name: shopmicro-mysql-prod
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_ROOT_HOST: '%'
    ports:
      - "3308:3306"
    volumes:
      - mysql-prod-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: always

  eureka-server:
    image: ${REGISTRY_URL:-localhost:5000}/shopmicro/eureka-server:${IMAGE_TAG:-latest}
    container_name: shopmicro-eureka-prod
    ports:
      - "8761:8761"
    environment:
      SPRING_PROFILES_ACTIVE: prod
    depends_on:
      mysql-prod:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: always

  api-gateway:
    image: ${REGISTRY_URL:-localhost:5000}/shopmicro/api-gateway:${IMAGE_TAG:-latest}
    container_name: shopmicro-gateway-prod
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      eureka-server:
        condition: service_healthy
    restart: always

  auth-service:
    image: ${REGISTRY_URL:-localhost:5000}/shopmicro/auth-service:${IMAGE_TAG:-latest}
    container_name: shopmicro-auth-prod
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-prod:3306/auth_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      mysql-prod:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    restart: always

  product-service:
    image: ${REGISTRY_URL:-localhost:5000}/shopmicro/product-service:${IMAGE_TAG:-latest}
    container_name: shopmicro-product-prod
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-prod:3306/product_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      mysql-prod:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    restart: always

  inventory-service:
    image: ${REGISTRY_URL:-localhost:5000}/shopmicro/inventory-service:${IMAGE_TAG:-latest}
    container_name: shopmicro-inventory-prod
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-prod:3306/inventory_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      mysql-prod:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    restart: always

  cart-service:
    image: ${REGISTRY_URL:-localhost:5000}/shopmicro/cart-service:${IMAGE_TAG:-latest}
    container_name: shopmicro-cart-prod
    ports:
      - "8084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-prod:3306/cart_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      mysql-prod:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    restart: always

  payment-service:
    image: ${REGISTRY_URL:-localhost:5000}/shopmicro/payment-service:${IMAGE_TAG:-latest}
    container_name: shopmicro-payment-prod
    ports:
      - "8085:8085"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-prod:3306/payment_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
    depends_on:
      mysql-prod:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    restart: always

  order-service:
    image: ${REGISTRY_URL:-localhost:5000}/shopmicro/order-service:${IMAGE_TAG:-latest}
    container_name: shopmicro-order-prod
    ports:
      - "8086:8086"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-prod:3306/order_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      mysql-prod:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    restart: always

  notification-service:
    image: ${REGISTRY_URL:-localhost:5000}/shopmicro/notification-service:${IMAGE_TAG:-latest}
    container_name: shopmicro-notification-prod
    ports:
      - "8087:8087"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-prod:3306/notification_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      mysql-prod:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    restart: always

volumes:
  mysql-prod-data:
