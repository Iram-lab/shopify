<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 0; }
        .container { max-width: 600px; margin: 30px auto; background: #fff; border-radius: 8px; overflow: hidden; }
        .header { background: #1a73e8; color: white; padding: 24px; text-align: center; }
        .body { padding: 24px; }
        .order-info { background: #f8f9fa; border-radius: 6px; padding: 16px; margin: 16px 0; }
        table { width: 100%; border-collapse: collapse; margin-top: 16px; }
        th { background: #1a73e8; color: white; padding: 10px; text-align: left; }
        td { padding: 10px; border-bottom: 1px solid #eee; }
        .total { font-size: 18px; font-weight: bold; color: #1a73e8; text-align: right; margin-top: 16px; }
        .footer { background: #f8f9fa; padding: 16px; text-align: center; color: #666; font-size: 12px; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Order Confirmed!</h1>
    </div>
    <div class="body">
        <p>Hi <strong th:text="${firstName}">Customer</strong>,</p>
        <p>Your order has been confirmed. Here are your order details:</p>

        <div class="order-info">
            <p><strong>Order Number:</strong> <span th:text="${orderNumber}"></span></p>
            <p><strong>Shipping Address:</strong> <span th:text="${shippingAddress}"></span></p>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Product</th>
                    <th>Qty</th>
                    <th>Unit Price</th>
                    <th>Subtotal</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="item : ${items}">
                    <td th:text="${item.productName}"></td>
                    <td th:text="${item.quantity}"></td>
                    <td th:text="'$' + ${item.unitPrice}"></td>
                    <td th:text="'$' + ${item.subtotal}"></td>
                </tr>
            </tbody>
        </table>

        <div class="total">
            Total: $<span th:text="${totalAmount}"></span>
        </div>
    </div>
    <div class="footer">
        <p>Thank you for shopping with us!</p>
    </div>
</div>
</body>
</html>
