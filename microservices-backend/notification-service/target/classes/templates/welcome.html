<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 0; }
        .container { max-width: 600px; margin: 30px auto; background: #fff; border-radius: 8px; overflow: hidden; }
        .header { background: #1a73e8; color: white; padding: 32px; text-align: center; }
        .body { padding: 32px; text-align: center; }
        .cta { display: inline-block; margin-top: 24px; padding: 14px 32px;
               background: #1a73e8; color: white; text-decoration: none;
               border-radius: 6px; font-size: 16px; }
        .footer { background: #f8f9fa; padding: 16px; text-align: center; color: #666; font-size: 12px; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Welcome to ECommerce!</h1>
    </div>
    <div class="body">
        <h2>Hi <span th:text="${firstName}">Customer</span>!</h2>
        <p>We're thrilled to have you on board. Start exploring thousands of products.</p>
        <a href="http://localhost:4200" class="cta">Start Shopping</a>
    </div>
    <div class="footer"><p>Happy Shopping!</p></div>
</div>
</body>
</html>
