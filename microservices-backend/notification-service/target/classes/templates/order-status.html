<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 0; }
        .container { max-width: 600px; margin: 30px auto; background: #fff; border-radius: 8px; overflow: hidden; }
        .header { background: #1a73e8; color: white; padding: 24px; text-align: center; }
        .body { padding: 24px; }
        .status-badge { display: inline-block; padding: 8px 20px; border-radius: 20px;
                        background: #1a73e8; color: white; font-size: 16px; font-weight: bold; }
        .footer { background: #f8f9fa; padding: 16px; text-align: center; color: #666; font-size: 12px; }
    </style>
</head>
<body>
<div class="container">
    <div class="header"><h1>Order Status Update</h1></div>
    <div class="body">
        <p>Hi <strong th:text="${firstName}">Customer</strong>,</p>
        <p>Your order <strong th:text="${orderNumber}"></strong> has been updated.</p>
        <p>New Status: <span class="status-badge" th:text="${newStatus}"></span></p>
    </div>
    <div class="footer"><p>Thank you for shopping with us!</p></div>
</div>
</body>
</html>
